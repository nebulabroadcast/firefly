name: Build binaries

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          # oldest supported runner: the binary needs glibc >= the build host's
          - os: ubuntu-22.04
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Build
        shell: bash
        run: make build

      - name: Get the version
        id: version
        shell: bash
        run: echo "value=$(uv version --short)" >> "$GITHUB_OUTPUT"

      - name: Package (Windows)
        if: matrix.platform == 'win'
        shell: pwsh
        run: >
          Compress-Archive
          -Path dist/firefly.exe, dist/images, dist/fonts, dist/skin.css
          -DestinationPath firefly-${{ steps.version.outputs.value }}-win.zip

      - name: Package (Linux)
        if: matrix.platform == 'linux'
        run: >
          tar -czf firefly-${{ steps.version.outputs.value }}-linux.tar.gz
          -C dist firefly images fonts skin.css

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: firefly-${{ matrix.platform }}
          path: firefly-${{ steps.version.outputs.value }}-*
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Get the version
        id: version
        run: echo "value=$(uv version --short)" >> "$GITHUB_OUTPUT"

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true

      - uses: ncipollo/release-action@v1
        with:
          artifacts: packages/*
          tag: v${{ steps.version.outputs.value }}
          name: Firefly ${{ steps.version.outputs.value }}
          body: Firefly version ${{ steps.version.outputs.value }}
          allowUpdates: true
          draft: true
          prerelease: false
