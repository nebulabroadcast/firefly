[project]
name = "firefly"
version = "6.0.3"
description = "Desktop client application for Nebula - Open source media asset management and broadcast automation system."
requires-python = ">=3.10,<3.15"

dependencies = [
  "websocket-client >=1.3.1",
  "unidecode >=1.3",
  "pydantic >=1.10.2",
  "PySide6 >=6.4.2"
]

[dependency-groups]
dev = [
  "ruff >=0.6.9",
  "qtsass >=0.3.2",
  "mypy >=1.19.1",
  "pyinstaller >=5.8.0",
]

[tool.ruff]
fix = true
line-length = 88
# vendored python-mpv, kept only as a fallback player (to be removed)
extend-exclude = ["firefly/proxyplayer/mpv.py"]

[tool.ruff.format]
indent-style = "space"
line-ending = "auto"

# Same base profile as nebula/backend
[tool.ruff.lint]
select = ["ALL"]

ignore = [
  "BLE",     # blind exceptions. I don't like them either, but they are useful in some cases
  "COM812",  # OK: messes with formatter
  "D",       # docstrings. Naaah.
  "EM",      # OK: String literals in exception messages (why not?)
  "FBT",     # Boolean positional argument (WTF?)
  "FIX002",  # TODOs
  "ISC001",  # OK: Incompatible with formatting
  "PLR2004", # OK: Magic numbers (just a few)
  "PTH",     # path-like objects
  "S101",    # OK: I like asserts. They make mypy happy
  "S104",    # OK: bind to all interfaces (We need this)
  "S110",    # OK: except: pass
  "S608",    # sql injections. let's wait for template strings
  "SIM105",  # OK: contextlib.suppress is ugly
  "TD002",   # Author name in TODOs
  "TD003",   # Issue link in TODOs
  "TRY003",  # OK: Avoid specicying long messages outside of exceptions
  "ANN",     # Any
  "ERA",     # Commented out code
  "RUF012",  # ClassVar
  "CPY001",  # Copyright header
  "PLR0917", # Too many positional arguments in function call
  # Firefly specific
  "N802",    # Qt overrides are camelCase (mousePressEvent, rowCount, ...)
  "ARG",     # Qt slots and virtual overrides have fixed signatures
  "C901",    # complexity: refactoring needs tests first
  "PLR0911", # too many returns: as above
  "PLR0912", # too many branches: as above
  "PLR0915", # too many statements: as above
  "DTZ",     # naive datetimes: broadcast schedules use local time on purpose
  "PERF203", # try/except in loops: zero-cost since Python 3.11
]

[tool.mypy]
plugins = ["pydantic.mypy"]
check_untyped_defs = true
disallow_any_generics = true
explicit_package_bases = true
no_implicit_reexport = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = "tests/|.venv/|build/|dist/"

[[tool.mypy.overrides]]
# vendored python-mpv, kept only as a fallback player (to be removed)
module = ["firefly.proxyplayer.mpv"]
ignore_errors = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# PySide6 stubs flag hundreds of issues in untyped Qt code; revisit later
module = ["PySide6.*"]
follow_imports = "skip"
ignore_missing_imports = true
